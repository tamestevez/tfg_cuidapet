<div class="container">
  <header class="header fixed-header top-header">
        
    <div class="logo">
        <a href="/">
            <img src="assets/logo-icon.png" alt="Huella animal" width="30" height="30">
            Cuidapet
        </a>
    </div>
    <div class="menu-header">
    <div class="controls">
    <select class="language-selector">
      <option>Español</option>
      <option>Gallego</option>
      <option>Catalán</option>
      <option>Euskera</option>
    </select>
    </div>
  <!-- Menú hamburguesa -->
    <div class="menu-container">
        <button class="btn-outline" (click)="toggleMenu()">
        Mi perfil
        </button>
        <ul class="menu" [class.show]="menuOpen">
            <li (click)="goToProfile()">Perfil</li>
            <li (click)="changePassword()">Cambiar Contraseña</li>
            <li (click)="contactSupport()">Contactar con Soporte</li>
            <li class="danger" (click)="deleteAccount()">Eliminar Cuenta</li>
        </ul>
    </div>


    <button class="btn-outline" (click)="logout()">Cerrar Sesión</button>
    </div>
</header>
    
    <main>
      <div class="admin-dashboard">
        <div class="titulo">
          <h2>Panel de Administración</h2>
          <a href="/private/admin/users"><button class="logout-btn">Gestionar Usuarios</button></a>
        </div>
        
    
        <div class="dashboard-card">
          <h3>Tasa de Adopciones</h3>
          <canvas id="adoptionChart"></canvas>
        </div>

        
      </div>
    </main>
  </div>
