<div class="container">
  <header class="header fixed-header top-header">
        
    <div class="logo">
        <a href="/">
            <img src="assets/logo-icon.png" alt="Huella animal" width="30" height="30">
            Cuidapet
        </a>
    </div>
    <div class="menu-header">
    <div class="controls">
    <select class="language-selector">
      <option>Español</option>
      <option>Gallego</option>
      <option>Catalán</option>
      <option>Euskera</option>
    </select>
    </div>
  <!-- Menú hamburguesa -->
    <div class="menu-container">
        <button class="btn-outline" (click)="toggleMenu()">
        Mi perfil
        </button>
        <ul class="menu" [class.show]="menuOpen">
            <li (click)="goToProfile()">Perfil</li>
            <li (click)="changePassword()">Cambiar Contraseña</li>
            <li (click)="contactSupport()">Contactar con Soporte</li>
            <li class="danger" (click)="deleteAccount()">Eliminar Cuenta</li>
        </ul>
    </div>


    <button class="btn-outline" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>
    
    <main>
      <div class="vet-animales-container">
        <header>
            <h1>Lista de Animales</h1>
            <a href="/private/vet/users"><button class="logout-btn">Gestionar Usuarios</button></a>
            <button class="add-animal-btn">+ Añadir Animal</button>
        </header>
    
        <div class="vet-animales-table">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Raza</th>
                        <th>Propietario/Protectora</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let animal of animales">
                        <td><a href="/private/vet/animal/{{animal.id}}">{{ animal.nombre }}</a></td>
                        <td>{{ animal.tipo }}</td>
                        <td>{{ animal.raza }}</td>
                        <td>{{ animal.prop}}</td>
                        <td>{{ animal.phone}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    </main>
  </div>
